<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
      #ball {
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0 38%, #d8dde8 70%, #8d95a8 100%);
        border: 1px solid #4a5268;
        cursor: grab;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="ball"></div>
    <script type="module" src="ball.js"></script>
  </body>
</html>
