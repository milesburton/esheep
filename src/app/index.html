<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
      /* The canvas gets its exact pixel size from the renderer: never stretch it to the window, or a
         wrongly sized window smears the sheep across the screen. */
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="128" height="128"></canvas>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
