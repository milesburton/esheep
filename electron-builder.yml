appId: io.github.milesburton.esheep
productName: eSheep
directories:
  output: release
files:
  - dist/**
  - assets/**
  - '!dist/demo/**'
  - '!dist/**/*.map'
  - '!dist/**/*.test.js'
  - '!dist/test/**'
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.entertainment
  extendInfo:
    NSAppleEventsUsageDescription: eSheep needs access to see other windows.
linux:
  target: AppImage
  category: Utility
