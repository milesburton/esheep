name: Package

# Builds installers with electron-builder on each OS, and (for a release) publishes them.
#   - automatic: release.yml calls this once CI is green on a commit whose package.json version has no
#     tag yet (`workflow_call`: it passes the commit and the tag to create);
#   - manual tag: pushing a `v*` tag does the same (`git tag -a v0.2.0 && git push origin v0.2.0`);
#   - by hand: "Run workflow" builds the installers and uploads them as artifacts, without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: The commit to build
        type: string
        required: true
      tag:
        description: The release tag to publish (created at that commit if it does not exist)
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Works out which commit to build and which tag (if any) to publish, whichever way we were started.
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.m.outputs.sha }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - id: m
        shell: bash
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          sha="${IN_SHA:-$GITHUB_SHA}"
          tag="$IN_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to release odd-looking tag: $tag"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $sha, release tag: ${tag:-none (build only)}"

  package:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: A release tag must match the package version
        if: needs.meta.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm run build

      # Prove the packaged app really starts on its own OS: it renders a sheep, reports whether the
      # native window module loaded, and exits. Windows is checked strictly (that is the main download).
      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'esheep-selftest.json'
          $env:ESHEEP_SELFTEST = $out
          $p = Start-Process -FilePath 'release/win-unpacked/eSheep.exe' -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'self-test did not finish in 60s' }
          if (-not (Test-Path $out)) { throw "no self-test report (exit code $($p.ExitCode))" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          $r | ConvertTo-Json | Write-Host
          if (-not $r.rendered) { throw 'the sheep window did not render' }
          if (-not $r.nativeWindows) { throw 'node-window-manager is not available in the packaged app' }
          if ($r.sheepWindows -lt 1) { throw 'no sheep window was created' }

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    # Only when there is a tag to publish. Publishes whatever built, but the Windows installer is mandatory.
    needs: [meta, package]
    if: ${{ !cancelled() && needs.meta.outputs.tag != '' && needs.package.result != 'skipped' }}
    concurrency:
      group: release-${{ needs.meta.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true
      - name: Check the Windows binary is there
        run: |
          ls -la dist
          ls dist/eSheep-Setup-*.exe dist/eSheep-Portable-*.exe
      - name: Checksums
        working-directory: dist
        run: sha256sum eSheep-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so tell gh which repo
          TAG: ${{ needs.meta.outputs.tag }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          - **Windows**: `eSheep-Setup-<version>-x64.exe` (installer) or `eSheep-Portable-<version>-x64.exe` (no install, just run it).
          - **macOS**: the `.dmg`. **Linux**: the `.AppImage` (`chmod +x` then run).

          These builds are **not code-signed**, so Windows SmartScreen will say "Windows protected your PC":
          choose **More info**, then **Run anyway**. macOS will ask you to approve it in System Settings,
          Privacy & Security. Verify a download against `SHA256SUMS.txt` if you like.

          eSheep lives in the system tray (Pause, Add sheep, Play tag, Start kick-about, Settings, Quit).
          The Windows build has had its startup verified in CI; it has not yet been tested by hand on a real
          Windows desktop, so please report anything odd.

          ---
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$SHA" --title "eSheep $TAG" --notes-file notes.md --generate-notes
          fi
